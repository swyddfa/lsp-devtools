[tool.esbonio.sphinx]
pythonCommand = [
    "uv", "run", "--no-project",
    "--with", "sphinx<9",
    "--with", "sphinx-copybutton",
    "--with", "sphinx-design",
    "--with", "furo",
    "--with", "myst-parser",
    "--with", "pygls>=2.0",
    "--with-editable", "../lib/pytest-lsp",
    "--with-editable", "../lib/lsp-devtools",
    "python",
]
