ci:
  autoupdate_schedule: quarterly

repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
    exclude: 'lib/pytest-lsp/pytest_lsp/clients/.*\.json'
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.7
  hooks:
  - id: ruff
    name: ruff (lsp-devtools)
    args: [--fix]
    files: 'lib/lsp-devtools/.*\.py'

  - id: ruff
    name: ruff (pytest-lsp)
    args: [--fix]
    files: 'lib/pytest-lsp/.*\.py'

  - id: ruff-format
    name: ruff-format (lsp-devtools)
    files: 'lib/lsp-devtools/.*\.py'

  - id: ruff-format
    name: ruff-format (pytest-lsp)
    files: 'lib/pytest-lsp/.*\.py'

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 'v1.19.0'
  hooks:
  - id: mypy
    name: mypy (pytest-lsp)
    args: [--explicit-package-bases,--check-untyped-defs]
    additional_dependencies:
    - importlib-resources
    - platformdirs
    - 'pygls>=2.0'
    - pytest
    - pytest-asyncio
    - websockets
    files: 'lib/pytest-lsp/pytest_lsp/.*\.py'

  - id: mypy
    name: mypy (lsp-devtools)
    args: [--explicit-package-bases,--check-untyped-defs]
    additional_dependencies:
    - aiosqlite
    - attrs
    - platformdirs
    - 'pygls>=2.0'
    - stamina
    - textual
    files: 'lib/lsp-devtools/lsp_devtools/.*\.py'

- repo: local
  hooks:
  - id: check-capabilities
    name: check-capabilities
    language: python
    additional_dependencies:
    - lsprotocol
    files: 'lib/pytest-lsp/pytest_lsp/clients/.*\.json'
    entry: python scripts/check_capabilities.py
