name: 'Release: pytest-lsp'

on:
  push:
    branches:
    - release
    paths:
    - 'lib/pytest-lsp/**'

jobs:
  release:
    name: pytest-lsp release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-lsp
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: true  # needed, I think to push commits to release branch

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: "3.10"

    - run: |
        python --version
        python -m pip install --upgrade pip
        python -m pip install tox hatch towncrier docutils
      name: Setup Environment

    - run: |
        set -e

        ./scripts/make_release.py pytest-lsp
      name: Set Version
      id: info

    - name: Package
      run: |
        cd lib/pytest-lsp
        hatch build

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: 'dist'
        path: lib/pytest-lsp/dist

    - name: Publish
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
      with:
        packages-dir: lib/pytest-lsp/dist/

    - name: Create Release
      run: |
        gh release create "${RELEASE_TAG}" \
          --title "pytest-lsp v${VERSION} - ${RELEASE_DATE}" \
          -F lib/pytest-lsp/.changes.html \
          ./lib/pytest-lsp/dist/*
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
