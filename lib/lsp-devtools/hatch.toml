[version]
path = "lsp_devtools/__init__.py"
validate-bump = false

[build.targets.sdist]
include = ["lsp_devtools", "tests", "CHANGES.md"]

[build.targets.wheel]
packages = ["lsp_devtools"]

[envs.hatch-test]
extra-dependencies = ["pytest-asyncio"]

[envs.hatch-test.env-vars]
UV_PRERELEASE="allow"

[[envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]
